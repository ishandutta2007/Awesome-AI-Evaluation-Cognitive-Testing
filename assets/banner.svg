<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="40%" stop-color="#a78bfa" />
      <stop offset="75%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25" />
    </pattern>

    <style>
      .pulse-slow {
        animation: pulse 6s ease-in-out infinite alternate;
      }
      .pulse-fast {
        animation: pulse 4s ease-in-out infinite alternate;
      }
      .dash-flow {
        stroke-dasharray: 6 6;
        animation: dashFlow 20s linear infinite;
      }
      .float-pill {
        animation: floatPill 5s ease-in-out infinite alternate;
      }
      @keyframes pulse {
        0% { transform: scale(0.95); opacity: 0.6; }
        100% { transform: scale(1.08); opacity: 1; }
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -1000; }
      }
      @keyframes floatPill {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-6px); }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Dynamic Glowing Orbs in Background -->
  <circle cx="220" cy="140" r="160" fill="url(#glowGrad1)" class="pulse-slow" style="transform-origin: 220px 140px;" />
  <circle cx="980" cy="270" r="180" fill="url(#glowGrad2)" class="pulse-fast" style="transform-origin: 980px 270px;" />

  <!-- Dynamic Connecting Circuit Lines (Background) -->
  <g stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.3" fill="none" class="dash-flow">
    <path d="M 50 100 Q 250 40 450 110 T 850 80 T 1150 120" />
    <path d="M 80 340 Q 300 380 600 320 T 950 350 T 1120 310" stroke="#ec4899" />
    <path d="M 600 0 L 600 80 M 600 340 L 600 420" stroke="#8b5cf6" />
  </g>

  <!-- Floating Feature Badges (Interactive look, behind text) -->
  <g class="float-pill" opacity="0.85">
    <!-- Pill 1: Evals -->
    <rect x="70" y="45" width="160" height="34" rx="17" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="88" cy="62" r="5" fill="#38bdf8" />
    <text x="102" y="67" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">LLM Benchmarking</text>

    <!-- Pill 2: Cognitive Agents -->
    <rect x="960" y="55" width="170" height="34" rx="17" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.2" />
    <circle cx="978" cy="72" r="5" fill="#a855f7" />
    <text x="992" y="77" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Cognitive Agents</text>

    <!-- Pill 3: Red Teaming -->
    <rect x="110" y="340" width="165" height="34" rx="17" fill="url(#cardGrad)" stroke="#f43f5e" stroke-width="1.2" />
    <circle cx="128" cy="357" r="5" fill="#f43f5e" />
    <text x="142" y="362" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Safety &amp; Red-Team</text>

    <!-- Pill 4: LLM-as-a-Judge -->
    <rect x="930" y="335" width="190" height="34" rx="17" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.2" />
    <circle cx="948" cy="352" r="5" fill="#10b981" />
    <text x="962" y="357" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">LLM-as-a-Judge &amp; RAG</text>
  </g>

  <!-- Central Foreground Content Container -->
  <!-- Top Badge -->
  <g transform="translate(600, 105)">
    <rect x="-170" y="-18" width="340" height="36" rx="18" fill="#1e1b4b" fill-opacity="0.8" stroke="#6366f1" stroke-width="1.5" />
    <text x="0" y="6" text-anchor="middle" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">⚡ THE DEFINITIVE CURATED REGISTRY ⚡</text>
  </g>

  <!-- Title (Foreground, crisp, high contrast) -->
  <text x="600" y="185" text-anchor="middle" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">
    AI Evaluation &amp; Cognitive Testing
  </text>

  <!-- Subtitle -->
  <text x="600" y="235" text-anchor="middle" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="600" letter-spacing="0.2">
    LLM Observability • Agent Harnesses • Reasoning Benchmarks • RAG Metrics • Guardrails
  </text>

  <!-- Tagline / Description -->
  <text x="600" y="275" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400">
    Curated SaaS Platforms &amp; Top Open-Source Frameworks for Rigorous Production AI Testing
  </text>

  <!-- Decorative Separator Line -->
  <line x1="450" y1="305" x2="750" y2="305" stroke="url(#titleGrad)" stroke-width="2.5" stroke-linecap="round" />
</svg>
